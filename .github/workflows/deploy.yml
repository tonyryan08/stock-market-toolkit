name: Deploy (parked)

# PARKED — by decision, week 2.
# Automation waits until committing-and-pushing is second nature and the
# team WANTS the robot. Until then, releasing is manual: `npm run deploy`.
#
# To reactivate: complete Part D of docs/setup-guide.md (two secrets),
# then replace the trigger below with:
#
#   on:
#     push:
#       branches: [main]

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
